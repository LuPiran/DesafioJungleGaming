services:
  postgres:
    image: postgres:16-alpine
    container_name: wagering-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks:
      - wagering

  localstack:
    image: localstack/localstack:4.3
    container_name: wagering-localstack
    restart: unless-stopped
    environment:
      SERVICES: sqs
      DEBUG: "0"
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/ready.d:/etc/localstack/init/ready.d:ro
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - wagering

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: wagering
      DATABASE_PASSWORD: wagering
      DATABASE_NAME: wagering
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
      SQS_WAGER_QUEUE_NAME: wager-transactions.fifo
      SQS_WAGER_DLQ_NAME: wager-transactions-dlq.fifo
      SQS_EVENTS_QUEUE_NAME: wager-events.fifo
      AUTH_ENABLED: "false"
    ports:
      - "3000-3002:3000"
    networks:
      - wagering

volumes:
  postgres_data:
  localstack_data:

networks:
  wagering:
    driver: bridge
